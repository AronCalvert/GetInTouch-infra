name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [frontend-updated, backend-updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/GetinTouch/backend && git pull origin main
            cd /root/GetinTouch/frontend && git pull origin main
            cd /root/GetinTouch/infra && git pull origin main
            cd /root/GetinTouch/infra && docker compose up --build -d
