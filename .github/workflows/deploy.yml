name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [frontend-updated, backend-updated]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: AronCalvert/GetinTouch-Backend
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        env:
          JWT_SECRET: test-secret-key-for-ci-only
          JWT_EXPIRATION: 86400000
          ADMIN_SECRET: test-admin-secret
          SPRING_PROFILES_ACTIVE: test
          LOGGING_LEVEL_ROOT: ERROR
          LOGGING_LEVEL_SPRING_SECURITY: ERROR
          LOGGING_LEVEL_SPRING_WEB: ERROR
          LOGGING_LEVEL_APP: ERROR
        run: mvn test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/GetinTouch/backend && git pull origin main
            cd /root/GetinTouch/frontend && git pull origin main
            cd /root/GetinTouch/infra && git pull origin main
            cd /root/GetinTouch/infra && docker compose up --build -d
